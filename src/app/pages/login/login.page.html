<ion-content class="login-content" [fullscreen]="true">
  <div class="login-wrap">

    <div class="login-hero">
      <span class="login-eyebrow">Observadores · pesca de cerco y atún</span>

      <div class="scan-badge">
        <ion-icon name="scan-outline"></ion-icon>
        <span class="scan-badge__line"></span>
      </div>

      <h1 class="login-title">VIGÍA</h1>
      <p class="login-subtitle">Detección de especies con IA</p>
    </div>

    <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">

      <div class="login-card">

        <div class="field">
          <label class="field__label" for="correo">
            Correo electrónico
          </label>

          <ion-item lines="none" class="field__box">
            <ion-input
              id="correo"
              name="correo"
              type="email"
              [(ngModel)]="correo"
              placeholder="ejemplo@correo.com"
              autocomplete="email"
              required>
            </ion-input>
          </ion-item>
        </div>

        <div class="field">
          <label class="field__label" for="password">
            Contraseña
          </label>

          <ion-item lines="none" class="field__box">
            <ion-input
              id="password"
              name="password"
              type="password"
              [(ngModel)]="password"
              autocomplete="current-password"
              required>
            </ion-input>
          </ion-item>
        </div>

      </div>

      <div class="login-forgot">
        <a routerLink="/recuperar">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- Este botón oculto permite que ENTER envíe el formulario -->
      <button
        type="submit"
        tabindex="-1"
        aria-hidden="true"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;">
      </button>

      <ion-button
        type="submit"
        expand="block"
        shape="round"
        class="btn-ingresar"
        [disabled]="cargando">

        <span *ngIf="!cargando">
          Ingresar
        </span>

        <ion-spinner
          *ngIf="cargando"
          name="crescent">
        </ion-spinner>

      </ion-button>

    </form>

    <div class="login-signup">
      <p>
        ¿No tienes cuenta?
        <a routerLink="/registro">Regístrate</a>
      </p>
    </div>

  </div>
</ion-content>
