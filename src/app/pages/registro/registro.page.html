<ion-header class="ion-no-border registro-header">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-button fill="clear" (click)="volverLogin()">
                <ion-icon name="arrow-back-outline" slot="start"></ion-icon>
                Volver
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="registro-content">
    <div class="registro-wrap">

        <div class="registro-hero">
            <span class="registro-eyebrow">Sistema VIGÍA</span>

            <div class="registro-icon">
                <ion-icon name="person-add-outline"></ion-icon>
            </div>

            <h1>Crear Cuenta</h1>
            <p>Únete al sistema de Observador de Pesca</p>
        </div>

        <!-- FORMULARIO -->
        <form (ngSubmit)="registrar()" #registroForm="ngForm">

            <div class="registro-card">

                <div class="field">
                    <label class="field__label" for="nombre">
                        Nombre
                    </label>

                    <ion-item lines="none" class="field__box">
                        <ion-input id="nombre" name="nombre" type="text" [(ngModel)]="usuario.nombre"
                            placeholder="Ej. Juan" autocomplete="given-name" required>
                        </ion-input>
                    </ion-item>
                </div>

                <div class="field">
                    <label class="field__label" for="apellido">
                        Apellido
                    </label>

                    <ion-item lines="none" class="field__box">
                        <ion-input id="apellido" name="apellido" type="text" [(ngModel)]="usuario.apellido"
                            placeholder="Ej. Pérez" autocomplete="family-name" required>
                        </ion-input>
                    </ion-item>
                </div>

                <div class="field">
                    <label class="field__label" for="correo">
                        Correo electrónico
                    </label>

                    <ion-item lines="none" class="field__box">
                        <ion-input id="correo" name="correo" type="email" [(ngModel)]="usuario.correo"
                            placeholder="ejemplo@correo.com" autocomplete="email" required>
                        </ion-input>
                    </ion-item>
                </div>

                <div class="field">
                    <label class="field__label" for="password">
                        Contraseña
                    </label>

                    <ion-item lines="none" class="field__box">
                        <ion-input id="password" name="password" type="password" [(ngModel)]="usuario.password"
                            placeholder="Ingresa tu contraseña" autocomplete="new-password" required>
                        </ion-input>
                    </ion-item>

                    <div class="password-requirements">

                        <span [class.valido]="requisitosPassword.longitud">
                            <ion-icon [name]="requisitosPassword.longitud
                    ? 'checkmark-circle'
                    : 'ellipse-outline'">
                            </ion-icon>

                            Mínimo 8 caracteres
                        </span>

                        <span [class.valido]="requisitosPassword.mayuscula">
                            <ion-icon [name]="requisitosPassword.mayuscula
                    ? 'checkmark-circle'
                    : 'ellipse-outline'">
                            </ion-icon>

                            Una letra mayúscula
                        </span>

                        <span [class.valido]="requisitosPassword.minuscula">
                            <ion-icon [name]="requisitosPassword.minuscula
                    ? 'checkmark-circle'
                    : 'ellipse-outline'">
                            </ion-icon>

                            Una letra minúscula
                        </span>

                        <span [class.valido]="requisitosPassword.numero">
                            <ion-icon [name]="requisitosPassword.numero
                    ? 'checkmark-circle'
                    : 'ellipse-outline'">
                            </ion-icon>

                            Un número
                        </span>

                        <span [class.valido]="requisitosPassword.especial">
                            <ion-icon [name]="requisitosPassword.especial
                    ? 'checkmark-circle'
                    : 'ellipse-outline'">
                            </ion-icon>

                            Un carácter especial
                        </span>

                    </div>
                </div>

                <div class="field">
                    <label class="field__label">
                        Tipo de cuenta
                    </label>

                    <div class="roles">

                        <button type="button" class="rol-card" [class.rol-activo]="usuario.id_rol===2"
                            (click)="seleccionarRol(2)">

                            <div class="rol-icon">
                                <ion-icon name="binoculars-outline"></ion-icon>
                            </div>

                            <div class="rol-info">
                                <strong>Observador</strong>
                                <span>Registra capturas y reportes de pesca.</span>
                            </div>

                            <ion-icon class="rol-check" [name]="usuario.id_rol===2
         ?'checkmark-circle'
         :'ellipse-outline'">
                            </ion-icon>

                        </button>

                        <button type="button" class="rol-card" [class.rol-activo]="usuario.id_rol===1"
                            (click)="seleccionarRol(1)">

                            <div class="rol-icon">
                                <ion-icon name="shield-checkmark-outline"></ion-icon>
                            </div>

                            <div class="rol-info">
                                <strong>Administrador</strong>
                                <span>
                                    Gestiona observadores y supervisa información.
                                </span>
                            </div>

                            <ion-icon class="rol-check" [name]="usuario.id_rol===1
         ?'checkmark-circle'
         :'ellipse-outline'">
                            </ion-icon>

                        </button>

                    </div>
                </div>

            </div>

            <!-- BOTÓN OCULTO PARA ENTER -->
            <button type="submit" tabindex="-1" aria-hidden="true" style="
     position:absolute;
     width:1px;
     height:1px;
     opacity:0;
     pointer-events:none;">
            </button>

            <!-- BOTÓN VISIBLE -->
            <ion-button type="submit" expand="block" shape="round" class="btn-registro" [disabled]="cargando">

                <span *ngIf="!cargando">
                    Registrarse
                </span>

                <ion-spinner *ngIf="cargando" name="crescent">
                </ion-spinner>

            </ion-button>

        </form>

        <div class="registro-login">
            <p>
                ¿Ya tienes una cuenta?
                <a (click)="volverLogin()">Inicia sesión</a>
            </p>
        </div>

    </div>
</ion-content>
