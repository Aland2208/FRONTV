<ion-content class="password-content">
  <div class="password-wrap">

    <div class="password-hero">
      <span class="password-eyebrow">Seguridad de la cuenta</span>

      <div class="password-icon">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>

      <h1>Nueva Contraseña</h1>
      <p>Crea una nueva contraseña para recuperar el acceso a tu cuenta.</p>
    </div>

    <div class="password-card">

      <div class="field">
        <label class="field__label">Nueva contraseña</label>

        <ion-item lines="none" class="field__box">
          <ion-input
            type="password"
            [(ngModel)]="nuevaPassword"
            placeholder="Ingresa tu nueva contraseña"
            autocomplete="new-password">
          </ion-input>
        </ion-item>

        <span class="field__help">
          Utiliza al menos 8 caracteres.
        </span>
      </div>

      <div class="field">
        <label class="field__label">Confirmar contraseña</label>

        <ion-item lines="none" class="field__box">
          <ion-input
            type="password"
            [(ngModel)]="confirmarPassword"
            placeholder="Repite tu nueva contraseña"
            autocomplete="new-password">
          </ion-input>
        </ion-item>
      </div>

    </div>

    <ion-button
      expand="block"
      shape="round"
      class="btn-guardar"
      (click)="cambiarPassword()"
      [disabled]="cargando">

      <span *ngIf="!cargando">
        Guardar contraseña
      </span>

      <ion-spinner
        *ngIf="cargando"
        name="crescent">
      </ion-spinner>

    </ion-button>

    <div class="password-footer">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
      <span>Tu contraseña será almacenada de forma segura</span>
    </div>

  </div>
</ion-content>
