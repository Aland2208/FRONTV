<ion-content class="password-content">

    <!-- VALIDANDO TOKEN -->
    <div class="password-wrap" *ngIf="validandoToken">

        <ion-spinner name="crescent"></ion-spinner>

    </div>


    <!-- FORMULARIO -->
    <div class="password-wrap" *ngIf="!validandoToken && tokenValido">

        <!-- ENCABEZADO -->
        <div class="password-hero">

            <span class="password-eyebrow">
                Seguridad de la cuenta
            </span>

            <div class="password-icon">

                <ion-icon name="lock-closed-outline">
                </ion-icon>

            </div>

            <h1>
                Nueva Contraseña
            </h1>

            <p>
                Crea una nueva contraseña para recuperar
                el acceso a tu cuenta.
            </p>

        </div>


        <!-- FORMULARIO -->
        <form (ngSubmit)="cambiarPassword()" #passwordForm="ngForm">

            <div class="password-card">

                <!-- NUEVA CONTRASEÑA -->
                <div class="field">

                    <label class="field__label" for="nuevaPassword">
                        Nueva contraseña
                    </label>

                    <ion-item lines="none" class="field__box">

                        <ion-input id="nuevaPassword" name="nuevaPassword" type="password" [(ngModel)]="nuevaPassword"
                            placeholder="Ingresa tu nueva contraseña" autocomplete="new-password" required>
                        </ion-input>

                    </ion-item>


                    <!-- REQUISITOS -->
                    <div class="password-requirements">

                        <span [class.valido]="requisitosPassword.longitud">

                            <ion-icon [name]="requisitosPassword.longitud
                                    ? 'checkmark-circle'
                                    : 'ellipse-outline'">
                            </ion-icon>

                            Mínimo 8 caracteres

                        </span>


                        <span [class.valido]="requisitosPassword.mayuscula">

                            <ion-icon [name]="requisitosPassword.mayuscula
                                    ? 'checkmark-circle'
                                    : 'ellipse-outline'">
                            </ion-icon>

                            Una letra mayúscula

                        </span>


                        <span [class.valido]="requisitosPassword.minuscula">

                            <ion-icon [name]="requisitosPassword.minuscula
                                    ? 'checkmark-circle'
                                    : 'ellipse-outline'">
                            </ion-icon>

                            Una letra minúscula

                        </span>


                        <span [class.valido]="requisitosPassword.numero">

                            <ion-icon [name]="requisitosPassword.numero
                                    ? 'checkmark-circle'
                                    : 'ellipse-outline'">
                            </ion-icon>

                            Un número

                        </span>


                        <span [class.valido]="requisitosPassword.especial">

                            <ion-icon [name]="requisitosPassword.especial
                                    ? 'checkmark-circle'
                                    : 'ellipse-outline'">
                            </ion-icon>

                            Un carácter especial

                        </span>

                    </div>

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="field">

                    <label class="field__label" for="confirmarPassword">
                        Confirmar contraseña
                    </label>

                    <ion-item lines="none" class="field__box">

                        <ion-input id="confirmarPassword" name="confirmarPassword" type="password"
                            [(ngModel)]="confirmarPassword" placeholder="Repite tu nueva contraseña"
                            autocomplete="new-password" required>
                        </ion-input>

                    </ion-item>

                </div>

            </div>


            <!-- BOTÓN OCULTO PARA ENTER -->
            <button type="submit" tabindex="-1" aria-hidden="true" style="
                    position:absolute;
                    width:1px;
                    height:1px;
                    opacity:0;
                    pointer-events:none;
                ">
            </button>


            <!-- BOTÓN VISIBLE -->
            <ion-button type="submit" expand="block" shape="round" class="btn-guardar" [disabled]="cargando">

                <span *ngIf="!cargando">
                    Guardar contraseña
                </span>

                <ion-spinner *ngIf="cargando" name="crescent">
                </ion-spinner>

            </ion-button>

        </form>


        <!-- MENSAJE INFERIOR -->
        <div class="password-footer">

            <ion-icon name="shield-checkmark-outline">
            </ion-icon>

            <span>
                Tu contraseña será almacenada de forma segura
            </span>

        </div>

    </div>

</ion-content>
