<div class="password-page">

  <div class="password-header">
    <span class="etiqueta">MI CUENTA</span>
    <h1>Cambiar contraseña</h1>
    <p>Actualiza la contraseña utilizada para acceder a tu cuenta.</p>
  </div>

  <div class="password-card">

    <div class="card-header">
      <div class="header-icono">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>

      <div>
        <span>SEGURIDAD DE LA CUENTA</span>
        <h2>Actualizar contraseña</h2>
        <p>Primero confirma tu contraseña actual.</p>
      </div>
    </div>

    <form (ngSubmit)="cambiarPassword()">

      <!-- CONTRASEÑA ACTUAL -->
      <div class="campo">
        <label for="passwordActual">
          Contraseña actual <span>*</span>
        </label>

        <div class="input-contenedor">
          <ion-icon name="lock-closed-outline"></ion-icon>

          <input
            id="passwordActual"
            name="passwordActual"
            [type]="mostrarActual ? 'text' : 'password'"
            [(ngModel)]="passwordActual"
            autocomplete="current-password"
            placeholder="Ingrese su contraseña actual">

          <button
            type="button"
            class="btn-ver"
            (click)="mostrarActual=!mostrarActual">
            <ion-icon
              [name]="mostrarActual ? 'eye-off-outline' : 'eye-outline'">
            </ion-icon>
          </button>
        </div>
      </div>

      <div class="separador"></div>

      <!-- NUEVA CONTRASEÑA -->
      <div class="campo">
        <label for="nuevaPassword">
          Nueva contraseña <span>*</span>
        </label>

        <div class="input-contenedor">
          <ion-icon name="key-outline"></ion-icon>

          <input
            id="nuevaPassword"
            name="nuevaPassword"
            [type]="mostrarNueva ? 'text' : 'password'"
            [(ngModel)]="nuevaPassword"
            autocomplete="new-password"
            placeholder="Ingrese la nueva contraseña">

          <button
            type="button"
            class="btn-ver"
            (click)="mostrarNueva=!mostrarNueva">
            <ion-icon
              [name]="mostrarNueva ? 'eye-off-outline' : 'eye-outline'">
            </ion-icon>
          </button>
        </div>

        <small>Mínimo 8 caracteres.</small>
      </div>

      <!-- CONFIRMAR -->
      <div class="campo">
        <label for="confirmarPassword">
          Confirmar nueva contraseña <span>*</span>
        </label>

        <div class="input-contenedor">
          <ion-icon name="shield-checkmark-outline"></ion-icon>

          <input
            id="confirmarPassword"
            name="confirmarPassword"
            [type]="mostrarConfirmacion ? 'text' : 'password'"
            [(ngModel)]="confirmarPassword"
            autocomplete="new-password"
            placeholder="Repita la nueva contraseña">

          <button
            type="button"
            class="btn-ver"
            (click)="mostrarConfirmacion=!mostrarConfirmacion">
            <ion-icon
              [name]="mostrarConfirmacion ? 'eye-off-outline' : 'eye-outline'">
            </ion-icon>
          </button>
        </div>
      </div>

      <div class="acciones">
        <button
          class="btn-guardar"
          type="submit"
          [disabled]="guardando">

          <ion-spinner
            *ngIf="guardando"
            name="crescent">
          </ion-spinner>

          <ion-icon
            *ngIf="!guardando"
            name="shield-checkmark-outline">
          </ion-icon>

          {{ guardando ? 'Actualizando...' : 'Cambiar contraseña' }}

        </button>
      </div>

    </form>

  </div>

</div>
